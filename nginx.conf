server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Tipos MIME adicionales
    include /etc/nginx/mime.types;
    types {
        application/manifest+json webmanifest;
    }

    # Cabeceras de seguridad básicas
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compresión Gzip para texto, CSS, JS, SVG y JSON
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Caché agresiva para recursos multimedia e inmutables (1 año)
    location ~* \.(webp|jpg|jpeg|png|gif|svg|ico|mp4|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
        access_log off;
    }

    # Caché moderada para CSS y JS (7 días)
    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Siempre revalidar HTML, sitemap y robots para cambios inmediatos
    location ~* \.(html|xml|txt|webmanifest)$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Ruta principal y soporte para navegación limpia
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Página 404 personalizada opcional
    error_page 404 /index.html;
}

