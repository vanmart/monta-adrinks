<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>De Montaña · Muy pronto</title>
<meta name="description" content="Granizados y cholados artesanales. Nuestra web llega muy pronto.">
<meta property="og:title" content="De Montaña · Muy pronto">
<meta property="og:description" content="Granizados y cholados artesanales. Nuestra web llega muy pronto.">
<meta property="og:type" content="website">
<style>
  :root { --txt:#fff; --accent:#ffd66b; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: #000; color: var(--txt);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .stage { position: fixed; inset: 0; overflow: hidden; }
  /* Capa de relleno: video borroso a pantalla completa (útil en pantallas anchas) */
  .fill { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    filter: blur(28px) brightness(.55); transform: scale(1.15); }
  /* Video principal: cubre en móvil, se centra completo en escritorio */
  .main { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  @media (min-aspect-ratio: 1/1) { .main { object-fit: contain; } }
  .shade { position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,.65), rgba(0,0,0,0) 45%, rgba(0,0,0,.35)); }
  .content { position: absolute; inset: 0; display: flex; flex-direction: column;
    justify-content: space-between; align-items: center; text-align: center;
    padding: max(2rem, env(safe-area-inset-top)) 1.5rem max(2.5rem, env(safe-area-inset-bottom)); }
  .brand { font-size: clamp(1rem, 2.5vw, 1.25rem); letter-spacing: .35em; text-transform: uppercase; font-weight: 600; }
  h1 { font-size: clamp(2rem, 6vw, 3.5rem); line-height: 1.1; font-weight: 700; text-shadow: 0 2px 20px rgba(0,0,0,.5); }
  h1 span { color: var(--accent); }
  p { margin-top: .75rem; opacity: .9; font-size: clamp(1rem, 2.2vw, 1.2rem); }
  .sound { position: absolute; right: 1rem; top: max(1rem, env(safe-area-inset-top)); z-index: 2;
    background: rgba(0,0,0,.45); color: #fff; border: 1px solid rgba(255,255,255,.4);
    border-radius: 999px; padding: .55rem .9rem; font: inherit; font-size: .85rem; cursor: pointer;
    backdrop-filter: blur(6px); }
  .sound:hover { background: rgba(0,0,0,.65); }
  @media (prefers-reduced-motion: reduce) { video { display: none; } .stage { background: #1a1a1a; } }
</style>
</head>
<body>
  <div class="stage">
    <video class="fill" src="video.mp4" autoplay muted loop playsinline aria-hidden="true"></video>
    <video class="main" id="v" src="video.mp4" autoplay muted loop playsinline preload="auto"></video>
    <div class="shade"></div>
  </div>

  <button class="sound" id="snd" type="button" aria-pressed="false">🔇 Activar sonido</button>

  <main class="content">
    <div class="brand">De Montaña</div>
    <div>
      <h1>Algo fresco viene <span>muy pronto</span></h1>
      <p>Granizados y cholados artesanales. Estamos preparando nuestra web.</p>
    </div>
  </main>

<script>
  const v = document.getElementById('v'), b = document.getElementById('snd');
  b.addEventListener('click', () => {
    v.muted = !v.muted;
    if (!v.muted) v.play().catch(() => {});
    b.textContent = v.muted ? '🔇 Activar sonido' : '🔊 Silenciar';
    b.setAttribute('aria-pressed', String(!v.muted));
  });
  // Mantener ambos videos sincronizados de forma simple
  const f = document.querySelector('.fill');
  v.addEventListener('seeked', () => { f.currentTime = v.currentTime; });
</script>
</body>
</html>
